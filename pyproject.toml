[project]
name = "testforge"
version = "0.1.0"
description = "E2E testing framework for ask-toby Telegram bot"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "TestForge Contributors" }
]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "structlog>=24.4",
    "anthropic>=0.39",
    "openai>=1.60",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[project.scripts]
testforge = "testforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testforge"]

# ---------- Ruff ----------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",        # pycodestyle / pyflakes
    "I",                  # isort
    "N",                  # pep8-naming
    "UP",                 # pyupgrade
    "B",                  # flake8-bugbear
    "C4",                 # comprehensions
    "SIM",                # simplify
    "RUF",                # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
