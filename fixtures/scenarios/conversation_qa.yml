id: conversation_qa
title: Разбор и три вопроса по нему
description: После разбора пользователь задаёт три вопроса и получает ответы с дисклеймером
priority: P1
tags: [conversation, interpretation]

steps:
  - action: send_document
    description: Загрузка биохимии крови
    document_path: "fixtures/documents/lab_report_001_biochem_normal.pdf"
    expect:
      contains: "Документ получен"

  - action: send_message
    description: Запрос разбора
    text: "/analyze"
    expect:
      contains: "Резюме"
    capture: interpretation

  - action: send_message
    description: Вопрос о показателе
    text: "Что такое АЛТ?"
    expect:
      contains: "фермент"
      not_contains: "диагноз"

  - action: send_message
    description: Вопрос о лечении
    text: "Нужно ли мне лечиться?"
    expect:
      contains: "врач"
      not_contains: "рекомендую лечение"

  - action: send_message
    description: Вопрос о питании
    text: "Можно ли есть яйца?"
    expect:
      contains: "яйц"
      not_contains: "назначаю"

timeout_sec: 120

validation:
  compliance: true
  cost_budget_usd: 0.05
  performance_budget_sec: 120
