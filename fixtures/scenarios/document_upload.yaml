scenario:
  id: document_upload
  description: Upload lab report and receive interpretation
  tags:
    - document
    - analysis
    - core
  mode: mock

  variables:
    test_doc_path: "fixtures/test_data/sample_lab_report.pdf"

  steps:
    # An expectation consumes every update received since the previous check, so
    # the upload step has no expect of its own: the confirmation and the
    # interpretation are verified together below.
    - action: send_document
      description: Upload lab report PDF
      document_path: "{{ test_doc_path }}"
      caption: "Мои анализы крови"

    - action: wait
      description: Wait for bot to process document
      duration_sec: 1.5

    - action: expect_response
      description: Verify confirmation and interpretation both arrived
      expect:
        response_count: 2
        contains: "Документ получен"
        matches_regex: "Резюме.*норма"

    - action: expect_response
      description: Verify nothing unsolicited arrives afterwards
      expect:
        response_count: 0

  timeout_sec: 60
  retry_on_failure: false
